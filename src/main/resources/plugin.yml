name: vDuels
version: ${project.version}
main: com.vduels.VDuels
api-version: '1.21'
author: nafehawan
description: GUI-based Duels and Party plugin.
softdepend:
  - FastAsyncWorldEdit

commands:
  vduels:
    description: vDuels root command (copy/paste, help).
    usage: /vduels <arena> <copy|paste> | /vduels help
  createarena:
    description: Create a new arena.
    usage: /createarena <name>
    permission: vduels.admin
  arena:
    description: Open the arena setup/settings GUI.
    usage: /arena <name>
    permission: vduels.admin
  deletearena:
    description: Delete an arena.
    usage: /deletearena <name>
    permission: vduels.admin
  kitcreate:
    description: Create a kit from your current inventory.
    usage: /kitcreate <name>
    permission: vduels.admin
  deletekit:
    description: Delete a kit.
    usage: /deletekit <name>
    permission: vduels.admin
  kiticon:
    description: Set a kit's menu icon to the item in your hand.
    usage: /kiticon <name>
    permission: vduels.admin
  kitdisplayname:
    description: Set a kit's display name (MiniMessage format).
    usage: /kitdisplayname <name> <display...>
    permission: vduels.admin
  editgui:
    description: Customise a GUI layout (duelconfirm, mapselect).
    usage: /editgui <menu>
    permission: vduels.admin
  category:
    description: Manage kit-menu categories.
    usage: /category <list|create|delete|header|addkit|removekit> ...
    permission: vduels.admin
  categoryqueue:
    description: Manage queue-menu categories.
    usage: /categoryqueue <list|create|delete|header|addkit|removekit> ...
    permission: vduels.admin
  scoreboardip:
    description: Set the server IP shown on the duel scoreboard.
    usage: /scoreboardip <ip>
    permission: vduels.admin
  duel:
    description: Challenge a player to a duel.
    usage: /duel <player>
  leave:
    description: Leave (forfeit) your current duel.
    usage: /leave
  queue:
    description: Open the 1v1 queue menu (or /queue leave).
    usage: /queue [leave]
  vduelstab:
    description: Configure the per-fight tab (title, discord, store).
    usage: /vduelstab
    permission: vduels.admin
  editkit:
    description: Edit a kit's starting effects.
    usage: /editkit [kit]
    permission: vduels.admin
  changekit:
    description: Equip a kit into your inventory.
    usage: /changekit <kit>
    permission: vduels.changekit
  spectate:
    description: Spectate a player (or /spectate to stop).
    usage: /spectate [player]
    aliases: [spec]

permissions:
  vduels.admin:
    description: Access to vDuels administration commands.
    default: op
  vduels.use:
    description: Access to the /duel command.
    default: true
  vduels.changekit:
    description: Access to the /changekit command.
    default: op
