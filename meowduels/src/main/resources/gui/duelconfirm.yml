# -------------------------------------------------------------------------
# Round Selection - the last screen before a duel request goes out.
#
# Every value here is the one the plugin uses when the key is missing, so you
# can delete any line, any item, or this whole file: the menu goes back to
# looking exactly as it ships. There is no reset command because deleting IS
# the reset.
#
# Each item takes:
#   slot      0-based, counting left to right then down (row 1 is 0-8)
#   material  any Minecraft item id, e.g. CLOCK, PAPER, LIME_DYE
#   amount    stack size shown on the icon, 1-64
#   name      the item's title
#   lore      the lines under it; "" is a blank spacer line
#   glow      true to force the enchanted shimmer, false to force it off
#
# An item with lore-on and lore-off has two faces - one for when the thing
# it controls is on, one for when it is off. name-on/name-off and
# material-on/material-off work the same way, and a plain name:/material:
# covers both states.
#
# Colours: <yellow>, <gold>, <#FF2E55> for a custom colour, or
# <gradient:#7CFF6B:#1FA32F>text</gradient>. Legacy &e codes work too.
#
# Placeholders usable in any name or lore on this screen:
#   {rounds}    the number of rounds currently selected
#   {gamemode}  the chosen kit's display name
#   {opponent}  who the duel is being sent to
#   {sender}    who is sending it
#
# The text below is written in small capitals (ᴛʜɪꜱ ꜱᴛʏʟᴇ). That is just what
# the characters are - type ordinary letters if you would rather have them.
#
# NOTE ON SLOTS: /editgui can also arrange this menu, and a layout saved there
# wins over the slot values below. The editor saves when you close it even if
# you changed nothing, so opening it once will pin these slots and make edits
# here look ignored. Run `/editgui duelconfirm reset` to clear that stored
# layout and hand control back to this file.
# -------------------------------------------------------------------------

title: "Round Selection"
rows: 3

# Uncomment to give this one screen a different frame from the rest of the
# plugin. Leave it out and it follows theme.filler in config.yml.
#filler: "GRAY_STAINED_GLASS_PANE"
#filler-name: " "

items:

  # The read-out: what is about to be sent, and to whom.
  info:
    slot: 10
    material: ITEM_FRAME
    name: "<blue>◆ <aqua>Information <blue>◆"
    lore:
      - ""
      - "<white>Gamemode: {gamemode}"
      - "<white>Rounds: <yellow>{rounds}"
      - "<white>Opponent: <yellow>{opponent}"
      - "<white>Sender: <yellow>{sender}"

  # Left-click raises the round count, right-click lowers it.
  # Clamped, not wrapped - the options are 1, 2, 3 and 5.
  clock:
    slot: 11
    material: CLOCK
    name: "<gold>✦ <yellow>Rounds <gold>✦"
    lore:
      - ""
      - "<yellow>Current <white>{rounds} Rounds"
      - ""
      - "<yellow>LMB <white>Increase Rounds"
      - "<yellow>RMB <white>Decrease Rounds"

  # Opens the map picker. Left unset, a random compatible arena is used.
  map:
    slot: 12
    material: PAPER
    name: "<aqua>⇄ Map Selection ⇄"
    lore:
      - "<white>Click to Open Menu!"

  # Sends the request.
  confirm:
    slot: 14
    material: LIME_DYE
    name: "<aqua>✔ Send Duel ✔"
    lore:
      - "<white>Click to Send Duel!"

  # Back to the kit picker this screen was opened from.
  cancel:
    slot: 22
    material: BARRIER
    name: "<red>✖ Go Back ✖"
    lore:
      - "<white>Go Back"
