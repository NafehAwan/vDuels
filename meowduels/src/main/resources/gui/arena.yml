# -------------------------------------------------------------------------
# /arena <name> - everything about one arena. The longest screen in the
# plugin; every toggle shares one pair of panes, set by ON_MATERIAL and
# OFF_MATERIAL in the code, so material-on/material-off here override
# them per item.
#
# Every value here is the one the plugin uses when the key is missing, so you
# can delete any line, any item, or this whole file: the menu goes back to
# looking exactly as it ships. There is no reset command because deleting IS
# the reset.
#
# Each item takes:
#   slot      0-based, counting left to right then down (row 1 is 0-8)
#   material  any Minecraft item id, e.g. CLOCK, PAPER, LIME_DYE
#   amount    stack size shown on the icon, 1-64
#   name      the item's title
#   lore      the lines under it; "" is a blank spacer line
#   glow      true to force the enchanted shimmer, false to force it off
#
# An item with lore-on and lore-off has two faces - one for when the thing
# it controls is on, one for when it is off. name-on/name-off and
# material-on/material-off work the same way, and a plain name:/material:
# covers both states.
#
# Theme placeholders, usable in any name or lore in any menu. These follow
# theme: in config.yml, so one edit there restyles every screen:
#   {value} {label} {muted} {good} {bad} {warn}   colours
#   {tick} {cross} {sep} {hint}                   the house symbols
# Write a colour out instead if you want one line to ignore the theme.
#
# Colours: <yellow>, <gold>, <#FF2E55> for a custom colour, or
# <gradient:#7CFF6B:#1FA32F>text</gradient>. Legacy &e codes work too.
#
# Placeholders usable in any name or lore on this screen:
#   {arena}        the arena's name
#   {kits}         how many kits are allowed here
#   {world}        the world it is in
#   {region}       its corner coordinates
#   {description}  its description, or the none-set line
#   {value}        a number item's current value
#   {state}        from that item's state-set / state-unset line
#   {blocks}       the border's starting size
#
# The text below is written in small capitals (ᴛʜɪꜱ ꜱᴛʏʟᴇ). That is just what
# the characters are - type ordinary letters if you would rather have them.
#
# THIS MENU HAS NO slot: OR rows: KEYS, ON PURPOSE. It decides what a click
# did by which slot was clicked, and its height is counted into those
# numbers, so moving an item or resizing the window would run the wrong
# action. Material, name and lore are all still yours to change.
# -------------------------------------------------------------------------

title: "&d&lᴀʀᴇɴᴀ: &5{arena}"

