# -------------------------------------------------------------------------
# /settings - each player's own switches.
#
# Every value here is the one the plugin uses when the key is missing, so you
# can delete any line, any item, or this whole file: the menu goes back to
# looking exactly as it ships. There is no reset command because deleting IS
# the reset.
#
# Each item takes:
#   slot      0-based, counting left to right then down (row 1 is 0-8)
#   material  any Minecraft item id, e.g. CLOCK, PAPER, LIME_DYE
#   amount    stack size shown on the icon, 1-64
#   name      the item's title
#   lore      the lines under it; "" is a blank spacer line
#   glow      true to force the enchanted shimmer, false to force it off
#
# An item with lore-on and lore-off has two faces - one for when the thing
# it controls is on, one for when it is off. name-on/name-off and
# material-on/material-off work the same way, and a plain name:/material:
# covers both states.
#
# Theme placeholders, usable in any name or lore in any menu. These follow
# theme: in config.yml, so one edit there restyles every screen:
#   {value} {label} {muted} {good} {bad} {warn}   colours
#   {tick} {cross} {sep} {hint}                   the house symbols
# Write a colour out instead if you want one line to ignore the theme.
#
# Colours: <yellow>, <gold>, <#FF2E55> for a custom colour, or
# <gradient:#7CFF6B:#1FA32F>text</gradient>. Legacy &e codes work too.
#
# The text below is written in small capitals (ᴛʜɪꜱ ꜱᴛʏʟᴇ). That is just what
# the characters are - type ordinary letters if you would rather have them.
# -------------------------------------------------------------------------

title: "<dark_gray>▏ <gradient:#A0E9FF:#4C7DF0>ꜱᴇᴛᴛɪɴɢꜱ</gradient>"
rows: 4

# Uncomment to give this one screen a different frame from the rest of the
# plugin. Leave it out and it follows theme.filler in config.yml.
#filler: "GRAY_STAINED_GLASS_PANE"
#filler-name: " "

items:

  # Whether anyone may send this player a duel.
  duel-requests:
    slot: 10
    material: IRON_SWORD
    name: "{value}ᴅᴜᴇʟ ʀᴇǫᴜᴇꜱᴛꜱ"
    glow-on: true
    lore-on:
      - ""
      - "{good}{tick}ᴀɴʏᴏɴᴇ ᴄᴀɴ ᴄʜᴀʟʟᴇɴɢᴇ ʏᴏᴜ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏꜰꜰ"
    lore-off:
      - ""
      - "{bad}{cross}ᴄʜᴀʟʟᴇɴɢᴇꜱ ᴀʀᴇ ʙʟᴏᴄᴋᴇᴅ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏɴ"

  # Whether anyone may invite them to a party.
  party-invites:
    slot: 11
    material: PLAYER_HEAD
    name: "{value}ᴘᴀʀᴛʏ ɪɴᴠɪᴛᴇꜱ"
    glow-on: true
    lore-on:
      - ""
      - "{good}{tick}ᴀɴʏᴏɴᴇ ᴄᴀɴ ɪɴᴠɪᴛᴇ ʏᴏᴜ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏꜰꜰ"
    lore-off:
      - ""
      - "{bad}{cross}ɪɴᴠɪᴛᴇꜱ ᴀʀᴇ ʙʟᴏᴄᴋᴇᴅ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏɴ"

  # Whether their duels can be watched.
  spectators:
    slot: 12
    material: ENDER_EYE
    name: "{value}ꜱᴘᴇᴄᴛᴀᴛᴏʀꜱ"
    glow-on: true
    lore-on:
      - ""
      - "{good}{tick}ᴏᴛʜᴇʀꜱ ᴄᴀɴ ᴡᴀᴛᴄʜ ʏᴏᴜʀ ᴅᴜᴇʟꜱ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏꜰꜰ"
    lore-off:
      - ""
      - "{bad}{cross}ʏᴏᴜʀ ᴅᴜᴇʟꜱ ᴀʀᴇ ᴘʀɪᴠᴀᴛᴇ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏɴ"

  # On, a match's chat is private to the match. Off by
  # default.
  isolated-chat:
    slot: 13
    material: OAK_SIGN
    name: "{value}ɪꜱᴏʟᴀᴛᴇᴅ ᴄʜᴀᴛ"
    glow-on: true
    lore-on:
      - ""
      - "{good}{tick}ɪɴ ᴀ ᴍᴀᴛᴄʜ, ᴏɴʟʏ ᴛʜᴇ ᴍᴀᴛᴄʜ ᴛᴀʟᴋꜱ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏꜰꜰ"
    lore-off:
      - ""
      - "{bad}{cross}ʏᴏᴜ ꜱᴇᴇ ᴀɴᴅ ᴊᴏɪɴ ᴛʜᴇ ᴡʜᴏʟᴇ ꜱᴇʀᴠᴇʀ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏɴ"

  # Their sidebar.
  scoreboard:
    slot: 14
    material: PAPER
    name: "{value}ꜱᴄᴏʀᴇʙᴏᴀʀᴅ"
    glow-on: true
    lore-on:
      - ""
      - "{good}{tick}ᴛʜᴇ ꜱɪᴅᴇʙᴀʀ ɪꜱ ᴏɴ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏꜰꜰ"
    lore-off:
      - ""
      - "{bad}{cross}ᴛʜᴇ ꜱɪᴅᴇʙᴀʀ ɪꜱ ʜɪᴅᴅᴇɴ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏɴ"

  # Every cue this plugin plays.
  sounds:
    slot: 15
    material: NOTE_BLOCK
    name: "{value}ᴍᴇɴᴜ ꜱᴏᴜɴᴅꜱ"
    glow-on: true
    lore-on:
      - ""
      - "{good}{tick}ᴄʟɪᴄᴋꜱ, ᴄᴏᴜɴᴛᴅᴏᴡɴꜱ ᴀɴᴅ ᴄᴜᴇꜱ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏꜰꜰ"
    lore-off:
      - ""
      - "{bad}{cross}ᴍᴇᴏᴡᴅᴜᴇʟꜱ ᴍᴀᴋᴇꜱ ɴᴏ ꜱᴏᴜɴᴅ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴛᴜʀɴ ᴏɴ"

  # Opens the per-kit armour trim picker. Only shown to players
  # with meowduels.trims.
  trims:
    slot: 16
    material: LEATHER_CHESTPLATE
    name: "{value}ᴋɪᴛ ᴛʀɪᴍꜱ"
    lore:
      - ""
      - "{label}ꜱᴇᴛ ʏᴏᴜʀ ᴀʀᴍᴏᴜʀ ᴛʀɪᴍ ᴘᴇʀ ᴋɪᴛ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴏᴘᴇɴ"
