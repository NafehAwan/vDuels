# -------------------------------------------------------------------------
# /party - the party at a glance, its members, and the leader's buttons.
#
# Every value here is the one the plugin uses when the key is missing, so you
# can delete any line, any item, or this whole file: the menu goes back to
# looking exactly as it ships. There is no reset command because deleting IS
# the reset.
#
# Each item takes:
#   slot      0-based, counting left to right then down (row 1 is 0-8)
#   material  any Minecraft item id, e.g. CLOCK, PAPER, LIME_DYE
#   amount    stack size shown on the icon, 1-64
#   name      the item's title
#   lore      the lines under it; "" is a blank spacer line
#   glow      true to force the enchanted shimmer, false to force it off
#
# An item with lore-on and lore-off has two faces - one for when the thing
# it controls is on, one for when it is off. name-on/name-off and
# material-on/material-off work the same way, and a plain name:/material:
# covers both states.
#
# Theme placeholders, usable in any name or lore in any menu. These follow
# theme: in config.yml, so one edit there restyles every screen:
#   {value} {label} {muted} {good} {bad} {warn}   colours
#   {tick} {cross} {sep} {hint}                   the house symbols
# Write a colour out instead if you want one line to ignore the theme.
#
# Colours: <yellow>, <gold>, <#FF2E55> for a custom colour, or
# <gradient:#7CFF6B:#1FA32F>text</gradient>. Legacy &e codes work too.
#
# Placeholders usable in any name or lore on this screen:
#   {leader}  the leader's name
#   {size}    how many are in the party
#   {kit}     the chosen kit
#   {alive}   how many are still in, mid-match
#   {player}  a member's name
#   {count}   used by overflow
#   {mode}    the mode line, from mode-fighting or mode-idle
#   {status}  the status line, from status-fighting or status-idle
#   {state}   a member's state, from one of the state-* lines
#   {why}     why start is lit or not, from one of the why-* lines
#
# The text below is written in small capitals (ᴛʜɪꜱ ꜱᴛʏʟᴇ). That is just what
# the characters are - type ordinary letters if you would rather have them.
# -------------------------------------------------------------------------

title: "<dark_gray>▏ <gradient:#FF8AD0:#B04BD6>ᴘᴀʀᴛʏ</gradient>"
rows: 4

# Uncomment to give this one screen a different frame from the rest of the
# plugin. Leave it out and it follows theme.filler in config.yml.
#filler: "GRAY_STAINED_GLASS_PANE"
#filler-name: " "

items:

  # Leaving as the leader, which disbands the party.
  leave-leader:
    slot: 33
    material: RED_DYE
    name: "<gradient:{no-from}:{no-to}>{cross}ᴅɪꜱʙᴀɴᴅ ᴘᴀʀᴛʏ</gradient>"
    lore:
      - ""
      - "{label}ᴇɴᴅꜱ ᴛʜᴇ ᴘᴀʀᴛʏ ꜰᴏʀ ᴇᴠᴇʀʏᴏɴᴇ"
      - ""
      - "{hint}ʏᴏᴜ'ʟʟ ʙᴇ ᴀꜱᴋᴇᴅ ᴛᴏ ᴄᴏɴꜰɪʀᴍ"

  # Leaving as a member.
  leave-member:
    slot: 31
    material: RED_DYE
    name: "<gradient:{no-from}:{no-to}>{cross}ʟᴇᴀᴠᴇ ᴘᴀʀᴛʏ</gradient>"
    lore:
      - ""
      - "{label}ᴛʜᴇ ᴘᴀʀᴛʏ ᴄᴀʀʀɪᴇꜱ ᴏɴ ᴡɪᴛʜᴏᴜᴛ ʏᴏᴜ"
      - ""
      - "{hint}ʏᴏᴜ'ʟʟ ʙᴇ ᴀꜱᴋᴇᴅ ᴛᴏ ᴄᴏɴꜰɪʀᴍ"

  # The party at a glance. mode-fighting/mode-idle and
  # status-fighting/status-idle are the two lines that read
  # differently mid-match.
  card:
    material: PAPER
    name: "<gradient:#FF8AD0:#B04BD6>ᴘᴀʀᴛʏ</gradient>"
    mode-fighting: "{value}{mode-label}"
    mode-idle: "{muted}ɴᴏᴛ ᴘɪᴄᴋᴇᴅ ʏᴇᴛ"
    status-fighting: "{good}ꜰɪɢʜᴛɪɴɢ <dark_gray>· {value}{alive} ꜱᴛɪʟʟ ɪɴ"
    status-idle: "{muted}ᴡᴀɪᴛɪɴɢ ꜰᴏʀ ᴛʜᴇ ʟᴇᴀᴅᴇʀ"
    lore:
      - ""
      - "{label}ʟᴇᴀᴅᴇʀ {sep}{value}{leader}"
      - "{label}ᴍᴇᴍʙᴇʀꜱ {sep}{value}{size}"
      - "{label}ᴋɪᴛ {sep}{kit}"
      - "{label}ᴍᴏᴅᴇ {sep}{mode}"
      - ""
      - "{label}ꜱᴛᴀᴛᴜꜱ {sep}{status}"

  # Leader only. Wears the chosen kit's icon unless you set
  # material-on.
  kit:
    slot: 11
    # material: STONE   # each row uses its own icon unless you set this
    name: "{value}ᴋɪᴛ"
    glow-on: true
    lore:
      - ""
      - "{label}ꜱᴇʟᴇᴄᴛᴇᴅ {sep}{kit}"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴘɪᴄᴋ ᴀ ᴋɪᴛ"

  # Leader only. Opens the invite list.
  invite:
    slot: 13
    material: PLAYER_HEAD
    name: "{value}ɪɴᴠɪᴛᴇ"
    lore:
      - ""
      - "{label}ᴀᴅᴅ ꜱᴏᴍᴇᴏɴᴇ ᴛᴏ ᴛʜᴇ ᴘᴀʀᴛʏ"
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴘɪᴄᴋ ᴡʜᴏ"

  # Leader only. Opens the party settings.
  settings:
    slot: 15
    material: GRINDSTONE
    name: "{value}ꜱᴇᴛᴛɪɴɢꜱ"
    lore:
      - ""
      - "{hint}ᴄʟɪᴄᴋ ᴛᴏ ᴏᴘᴇɴ"

  # Leader only. Its off face is a party that cannot start yet;
  # why-fighting, why-too-few and why-ready say which.
  start:
    slot: 29
    material-on: LIME_DYE
    material-off: GRAY_DYE
    name-on: "<gradient:{go-from}:{go-to}>{tick}ꜱᴛᴀʀᴛ ᴍᴀᴛᴄʜ</gradient>"
    name-off: "{muted}{cross}ꜱᴛᴀʀᴛ ᴍᴀᴛᴄʜ"
    glow-on: true
    why-fighting: "{muted}ᴀʟʀᴇᴀᴅʏ ꜰɪɢʜᴛɪɴɢ"
    why-ready: "{label}ꜰꜰᴀ, ꜱᴘʟɪᴛ ᴏʀ ᴅᴜᴇʟꜱ"
    why-too-few: "<#FF8A93>ɴᴇᴇᴅꜱ ᴀᴛ ʟᴇᴀꜱᴛ 2 ᴘʟᴀʏᴇʀꜱ"
    lore:
      - ""
      - "{why}"

  # One head per member, capped at nine. Its on face is the
  # leader. state-alive, state-out, state-offline and
  # state-idle are the line under the role.
  member:
    material: PLAYER_HEAD
    name-on: "<#FFD65C>★ {value}{player}"
    name-off: "<#C79BFF>◆ {value}{player}"
    glow-on: true
    state-alive: "{good}⚡ ᴀʟɪᴠᴇ"
    state-idle: ""
    state-offline: "{muted}ᴏꜰꜰʟɪɴᴇ"
    state-out: "<dark_gray>☠ {muted}ᴇʟɪᴍɪɴᴀᴛᴇᴅ"
    lore-on:
      - ""
      - "<#FFD65C>ʟᴇᴀᴅᴇʀ"
      - "{state}"
    lore-off:
      - ""
      - "{label}ᴍᴇᴍʙᴇʀ"
      - "{state}"
