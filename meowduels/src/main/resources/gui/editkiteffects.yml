# -------------------------------------------------------------------------
# /editkit <kit> - the potion effects a kit starts a match with, and the
# two admin actions that redefine the kit itself.
#
# Every value here is the one the plugin uses when the key is missing, so you
# can delete any line, any item, or this whole file: the menu goes back to
# looking exactly as it ships. There is no reset command because deleting IS
# the reset.
#
# Each item takes:
#   slot      0-based, counting left to right then down (row 1 is 0-8)
#   material  any Minecraft item id, e.g. CLOCK, PAPER, LIME_DYE
#   amount    stack size shown on the icon, 1-64
#   name      the item's title
#   lore      the lines under it; "" is a blank spacer line
#   glow      true to force the enchanted shimmer, false to force it off
#
# An item with lore-on and lore-off has two faces - one for when the thing
# it controls is on, one for when it is off. name-on/name-off and
# material-on/material-off work the same way, and a plain name:/material:
# covers both states.
#
# Colours: <yellow>, <gold>, <#FF2E55> for a custom colour, or
# <gradient:#7CFF6B:#1FA32F>text</gradient>. Legacy &e codes work too.
#
# Placeholders usable in any name or lore on this screen:
#   {kit}  the kit's id
#
# The text below is written in small capitals (ᴛʜɪꜱ ꜱᴛʏʟᴇ). That is just what
# the characters are - type ordinary letters if you would rather have them.
# -------------------------------------------------------------------------

title: "&7&lᴇᴅɪᴛ ᴋɪᴛ → &7{kit}"
rows: 3

# Uncomment to give this one screen a different frame from the rest of the
# plugin. Leave it out and it follows theme.filler in config.yml.
#filler: "GRAY_STAINED_GLASS_PANE"
#filler-name: " "

items:

  # Strength II for the first 90 seconds.
  strength:
    slot: 10
    material: BLAZE_POWDER
    name: "&cꜱᴛʀᴇɴɢᴛʜ ɪɪ &7(1:30)"
    lore-on:
      - ""
      - "&aᴇɴᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."
    lore-off:
      - ""
      - "&cᴅɪꜱᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."

  # Speed II for the first 90 seconds.
  speed:
    slot: 12
    material: SUGAR
    name: "&dꜱᴘᴇᴇᴅ ɪɪ &7(1:30)"
    lore-on:
      - ""
      - "&aᴇɴᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."
    lore-off:
      - ""
      - "&cᴅɪꜱᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."

  # Speed II for the whole match.
  speed-infinite:
    slot: 14
    material: FEATHER
    name: "&dꜱᴘᴇᴇᴅ ɪɪ &7(ɪɴꜰɪɴɪᴛᴇ)"
    lore-on:
      - ""
      - "&aᴇɴᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."
    lore-off:
      - ""
      - "&cᴅɪꜱᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."

  # Regeneration II for the first 90 seconds.
  regeneration:
    slot: 16
    material: GHAST_TEAR
    name: "&aʀᴇɢᴇɴᴇʀᴀᴛɪᴏɴ ɪɪ &7(1:30)"
    lore-on:
      - ""
      - "&aᴇɴᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."
    lore-off:
      - ""
      - "&cᴅɪꜱᴀʙʟᴇᴅ"
      - "&7ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ."

  # Opens the kit's item grid. Changes apply to every player.
  edit-items:
    slot: 21
    material: CHEST
    name: "&d&lᴇᴅɪᴛ ɪᴛᴇᴍꜱ"
    lore:
      - "&7ᴏᴘᴇɴ ᴛʜᴇ ᴋɪᴛ'ꜱ ɪᴛᴇᴍ ɢʀɪᴅ."
      - ""
      - "&cᴄʜᴀɴɢᴇꜱ ᴀᴘᴘʟʏ ᴛᴏ ᴇᴠᴇʀʏᴏɴᴇ."

  # Replaces the kit with whatever the admin is holding.
  # Needs a shift-click, since it cannot be undone.
  capture:
    slot: 23
    material: PLAYER_HEAD
    name: "&a&lᴄʜᴀɴɢᴇ ᴋɪᴛ"
    lore:
      - "&7ᴍᴀᴋᴇ ᴛʜɪꜱ ᴋɪᴛ ᴇxᴀᴄᴛʟʏ ᴡʜᴀᴛ ʏᴏᴜ"
      - "&7ᴀʀᴇ ʜᴏʟᴅɪɴɢ ʀɪɢʜᴛ ɴᴏᴡ."
      - ""
      - "&cʀᴇᴘʟᴀᴄᴇꜱ ᴛʜᴇ ᴋɪᴛ ꜰᴏʀ ᴇᴠᴇʀʏᴏɴᴇ."
      - "&eꜱʜɪꜰᴛ-ᴄʟɪᴄᴋ ᴛᴏ ᴄᴏɴꜰɪʀᴍ."
