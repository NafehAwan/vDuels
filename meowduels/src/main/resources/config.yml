# ============================================================================
#  MeowDuels  -  config.yml   (ONE file for everything)
#  New options are auto-added on startup - your values are never overwritten.
# ============================================================================

# ---- Duel requests ----
duel:
  request-expiry-seconds: 60
  default-rounds: 1

# ---- Ranked / ELO ----
ranked:
  # Anti alt-grinding: after you gain ELO off a player, beating that SAME player
  # again within this many minutes awards no ELO (stats/streak still count).
  # Set 0 to disable. Queue matches are always ranked; /duel has a toggle.
  elo-cooldown-minutes: 30

# ---- Rounds / pacing (seconds, decimals allowed) ----
rounds:
  match-found-seconds: 4.0
  # Pre-fight ready-up countdown: players may move (but not fight); both sneaking
  # to "ready" ends it early.
  countdown-seconds: 5
  transition-seconds: 3.5
  end-seconds: 3.5
  # After you die, how long you spectate the spot you died before the next round
  # teleports you into the arena.
  death-spectate-seconds: 2.0
  # Seconds the match lingers (winner in arena / loser spectating) before everyone
  # is teleported to spawn when the match ends.
  win-teleport-seconds: 2.0

# ---- Party ----
party:
  # Seconds between everyone landing in the arena and the fighting opening.
  # Nobody can be hurt until it reaches zero.
  countdown-seconds: 5
  # true  - a party gets its own tab list, the way a duel does. The party sees
  #         the party; the rest of the server still sees them, with their real
  #         rank, because the hiding is one-directional.
  # false - no separate list. Everyone stays in the shared tab list and the
  #         party is just a group of people in it.
  # Takes effect on the next membership change, or /meowduels reload.
  separate-tab: true

# ---- Golden Head (modern-UHC healing head) ----
golden-head:
  # Seconds a player must wait between eating Golden Heads. 0 = no cooldown.
  cooldown-seconds: 5.0
  # Head skin. Paste the base64 "Value" string from minecraft-heads.com (search
  # "Golden Head") between the quotes to give it a golden skin. Leave empty for a
  # plain head. Applies to heads given after you set it (re-give with /givegoldenhead).
  texture: ""

# ---- Event world border (FFA events shrink the border over time) ----
event:
  border:
    enabled: true
    # Starting size in blocks. 0 = auto-fit the arena's size.
    start-size: 0
    # The border stops shrinking here (a 30x30 area by default).
    min-size: 30
    # How often the border shrinks one step.
    interval-seconds: 120
    # How many blocks smaller each step is.
    step: 20
    # How long each shrink animation takes (the border glows red while moving).
    shrink-seconds: 8
    # Damage for standing outside the border, applied once a second.
    # It ramps: the first second costs `base`, and every further second you stay
    # out adds `per-second`, up to `max`. Stepping back inside resets it, so the
    # penalty is for being out rather than for having been out. 2.0 = one heart.
    # `base` matches what a single second outside used to cost, so nothing got
    # gentler - it just no longer stays that cheap. Armour still reduces it.
    damage:
      base: 2.0
      per-second: 1.0
      max: 20.0

# Shown in dark grey after a fighter's name in the tab list.
# NOTE: the default is an emoji, which Minecraft's built-in font does not have -
# without a resource pack providing the glyph it renders as a box. Vanilla-safe
# alternatives that always render: the crossed swords U+2694, or a dagger-ish
# U+271D. Set to '' to show nothing.
duel-marker: "\U0001F5E1"
# Health, hunger and potion effects are reset on join. The teleport to spawn and
# the spawn hotbar are NOT part of this - they happen on every join regardless,
# because a player who lands somewhere random with an empty hotbar has no way in.
on-join-reset: true

# Dying outside a duel or an event puts you back at spawn holding the spawn
# items. Duel deaths still respawn on your side of the arena. Turn this off if
# another plugin owns respawns on this server.
on-death-spawn: true

# ---- Tab list handoff (TAB draws the tab list; MeowDuels draws the sidebar) ----
external-tab: true

# Server IP shown by {server_ip} / {server_ip_sc} (small-caps version).
# Set in-game with: /scoreboardip <ip> [color]
scoreboard-ip: "example.net"
scoreboard-ip-color: "<#FF78C1>"

# Server name shown as the duel scoreboard title ({server_name}).
# Set in-game with: /meowduelsserver <name...>
server-name: "server"

# ============================================================================
#  TAB LIST
# ----------------------------------------------------------------------------
#  TAB draws the tab list; these are the header and footer lines it asks for,
#  one placeholder per line:  %meowduels_tab_header_1% .. %meowduels_tab_footer_4%
#  See tab/config.yml in the plugin folder for the TAB side.
#
#  Three layouts, chosen per viewer:
#    global - not fighting, not in a party
#    duel   - fighting a duel, or spectating one
#    party  - in a party (whether or not it is mid-match)
#
#  MiniMessage. "" is a blank line; delete a line to shorten a layout.
#  Tokens: {player} {ping} {rank} {elo} {online} {in_duels}
#          {server_ip} {server_name} {discord} {store}
#    duel:  {opponent} {score} {opponent_score} {kit} {arena} {round}
#           {rounds_to_win} {time} {team_color}
#    party: {party_leader} {party_size} {party_kit} {party_status}
#           {party_alive} {party_role}
# ============================================================================
tab:
  # The duel/party tab bubble hides everyone you are not fighting or partied
  # with. false (default) hides them from the TAB LIST ONLY - they are still
  # there in the world, visible and hittable.
  #
  # Turn it true only if they keep reappearing in the list. TAB re-adds rows
  # MeowDuels removes, and MeowDuels puts them back once a second; if your TAB
  # build wins that argument, this switches to the cruder hide that nothing can
  # undo - at the cost of those players vanishing from the world too.
  bubble-hides-world: false

  # Branding, used by the duel/party layouts below and by the built-in tab when
  # external-tab is false.
  title: "<gold><bold>ServerName</bold></gold>"
  discord: "<aqua>discord.example.net</aqua>"
  store: "<yellow>store.example.net</yellow>"

  global:
    header:
    - ""
    - "<bold><gradient:#FF2D95:#FF8AD0>{server_name}</gradient></bold>"
    - "<#8E959D>\u1d0f\u0274\u029f\u026a\u0274\u1d07 <dark_gray>\u00bb <white>{online}  <dark_gray>\u2022  <#8E959D>\u026a\u0274 \u1d05\u1d1c\u1d07\u029f\ua731 <dark_gray>\u00bb <white>{in_duels}"
    - ""
    footer:
    - ""
    - "<#8E959D>{discord}"
    - "<#FF5FB0>{server_ip}"

  # Fighters and the people watching them. Their tab list is only the match, so
  # the header carries the match: who, what, where and the score.
  duel:
    header:
    - ""
    - "<bold><gradient:#FF2D95:#FF8AD0>\u1d05\u1d1c\u1d07\u029f</gradient></bold>"
    - "{team_color}{player} <dark_gray>\u00bb <white>{score} <dark_gray>-</dark_gray> <white>{opponent_score} <dark_gray>\u00ab <red>{opponent}"
    - ""
    - "<#8E959D>\u1d0b\u026a\u1d1b <dark_gray>\u00bb <white>{kit}  <dark_gray>\u2022  <#8E959D>\u0280\u1d0f\u1d1c\u0274\u1d05 <dark_gray>\u00bb <white>{round}<dark_gray>/<gray>{rounds_to_win}"
    - ""
    footer:
    - ""
    - "<#8E959D>\u1d00\u0280\u1d07\u0274\u1d00 <dark_gray>\u00bb <white>{arena}  <dark_gray>\u2022  <#8E959D>\u1d1b\u026a\u1d0d\u1d07 <dark_gray>\u00bb <white>{time}"
    - "<#FF5FB0>{server_ip}"

  # A party sees only the party. Idle it shows who runs it; mid-match the header
  # switches to how many are left, because that is what anyone is looking at.
  party:
    header:
    - ""
    - "<bold><gradient:#FF8AD0:#B04BD6>\u1d18\u1d00\u0280\u1d1b\u028f</gradient></bold>"
    - "<#8E959D>\u029f\u1d07\u1d00\u1d05\u1d07\u0280 <dark_gray>\u00bb <white>{party_leader}  <dark_gray>\u2022  <#8E959D>\u1d0d\u1d07\u1d0d\u0299\u1d07\u0280\ua731 <dark_gray>\u00bb <white>{party_size}"
    - "<#8E959D>\u1d0b\u026a\u1d1b <dark_gray>\u00bb <white>{party_kit}  <dark_gray>\u2022  <#8E959D>\ua731\u1d1b\u1d00\u1d1b\u1d1c\ua731 <dark_gray>\u00bb <white>{party_status}"
    - ""
    footer:
    - ""
    - "<#8E959D>\u028f\u1d0f\u1d1c <dark_gray>\u00bb <white>{party_role}  <dark_gray>\u2022  <#8E959D>\u1d00\u029f\u026a\u1d20\u1d07 <dark_gray>\u00bb <white>{party_alive}"
    - "<#FF5FB0>{server_ip}"

# ============================================================================
#  SIDEBAR SCOREBOARD
# ----------------------------------------------------------------------------
#  global -> shown when NOT fighting.   duel -> shown while fighting.
#  MiniMessage text. "" = blank line. Max 15 lines.
#  Tokens: {player} {online} {in_duels} {server_ip} {server_ip_sc}
#          {ip_color} {ping} {kills} {deaths} {playtime} {streak}
#          {date} {server_name}
#          (duel board also: {score} {opponent_score} {opponent} {kit}
#           {arena} {wins} {losses} {round} {time} etc.)
# ============================================================================
scoreboard:
  # Leave TRUE while TAB is installed. TAB draws nametags AND sorts the tab list
  # with the same scoreboard teams; if MeowDuels draws its own, the two fight
  # over them and fighters lose their place in the sort order. The duel and FFA
  # nametags come through %rel_meowduels_tagprefix% instead.
  external-nametags: true
  # Master switch. The sidebar only shows while in a duel or spectating one.
  enabled: true
  date-format: "dd/MM/yyyy"
  # Action bar shown while fighting/spectating. {score} is always YOUR side
  # (or the spectated player's), {opponent_score} the enemy.
  action-bar: "{score} <gray>-</gray> {opponent_score}"
  # The one sidebar. Duellists see it too - there is no separate duel board -
  # and a party sees none at all. Its own `enabled` is no longer read; the
  # master switch above is the only switch. Empty `lines` also means no board.
  global:
    enabled: true
    title: "<bold><red>ʙʟᴏᴏᴅᴛʜɪʀꜱᴛ"
    lines:
    - "<gray><strikethrough>                    </strikethrough>"
    - "<#D90707>⚔ ᴋɪʟʟꜱ <dark_gray>: <red>{kills}"
    - "<#D90707>☠ ᴅᴇᴀᴛʜꜱ <dark_gray>: <red>{deaths}"
    - "<#D90707>⌚ ᴘʟᴀʏᴛɪᴍᴇ <dark_gray>: <red>{playtime}"
    - "<gray><strikethrough>                    </strikethrough>"
    - "{ip_color}{server_ip}"
  # Shown to everyone in an FFA event - fighters and knocked-out spectators
  # alike. {alive}/{ffa_players} is who is left out of who started; {ffa_kills}
  # is YOUR kills this event, reset when a new one starts.
  ffa:
    enabled: true
    title: "<bold><gradient:#FFD65C:#FF8A2E>ғғᴀ</gradient></bold>"
    lines:
    - "<yellow>⚡ <white>{player}"
    - ""
    - "<#FFC53D>☠ <gray>ᴋɪʟʟꜱ <dark_gray>» <white>{ffa_kills}"
    - "<#FFC53D>♦ <gray>ᴀʟɪᴠᴇ <dark_gray>» <white>{alive}<dark_gray>/<gray>{ffa_players}"
    - "<#FFC53D>◉ <gray>ᴏᴜᴛ <dark_gray>» <white>{ffa_spectators}"
    - ""
    - "<#FFC53D>✦ <gray>ᴋɪᴛ <dark_gray>» <white>{ffa_kit}"
    - "<#FFC53D>⌚ <gray>ᴛɪᴍᴇ <dark_gray>» <white>{ffa_time}"
    - ""
    - "{ip_color}{server_ip}"
  # There is no duel-specific board. Duellists see the `global` one above, and
  # a party sees no sidebar at all. The old duel layout is in git if you want it
  # back; it is not read from here, so leaving a copy would be a switch that
  # does nothing.

# PvP inside a match.
#
# A duel, a party match or an FFA round can run inside a region belonging to
# another plugin. If that region denies PvP - including the common case of a
# region drawn with a low Y ceiling, which silently stops the fight working once
# anyone climbs above it - MeowDuels takes the hit back: it re-checks its own
# rules (countdown, Split friendly fire, whether the event is running) and
# allows the hit if the match allows it. Height is never part of that decision.
#
# Turn this off only if you want region flags to win inside arenas too.
pvp:
  force-in-match: true
