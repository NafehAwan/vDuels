# TAB config.yml - the header-footer section
#
# Paste this over the header-footer block in plugins/TAB/config.yml, then
# /tab reload.
#
# TAB draws the tab list, so these are the only two things MeowDuels cannot do
# on its own: which header a player sees, and how often it is refreshed. Every
# line is one placeholder, and MeowDuels decides per viewer whether it answers
# with the global, duel or party layout - all three live in MeowDuels'
# config.yml under `tab:`, next to the scoreboards they mirror.
#
# Change the WORDING in MeowDuels' config.yml, not here. The only reason to edit
# this file is to add or remove a LINE, and even then an unused line answers
# empty rather than showing its own name, so leaving spares in costs nothing.

header-footer:
  enabled: true
  header:
    - "%meowduels_tab_header_1%"
    - "%meowduels_tab_header_2%"
    - "%meowduels_tab_header_3%"
    - "%meowduels_tab_header_4%"
    - "%meowduels_tab_header_5%"
    - "%meowduels_tab_header_6%"
  footer:
    - "%meowduels_tab_footer_1%"
    - "%meowduels_tab_footer_2%"
    - "%meowduels_tab_footer_3%"
    - "%meowduels_tab_footer_4%"

# Without these TAB resolves each placeholder once and never again, and the duel
# header freezes on the score it had when the fight started. 1000ms is the same
# rate MeowDuels ticks its own scoreboard at, so the two never disagree.
placeholder-refresh-intervals:
  "%meowduels_tab_header_1%": 1000
  "%meowduels_tab_header_2%": 1000
  "%meowduels_tab_header_3%": 1000
  "%meowduels_tab_header_4%": 1000
  "%meowduels_tab_header_5%": 1000
  "%meowduels_tab_header_6%": 1000
  "%meowduels_tab_footer_1%": 1000
  "%meowduels_tab_footer_2%": 1000
  "%meowduels_tab_footer_3%": 1000
  "%meowduels_tab_footer_4%": 1000
  # The name rows. These are relational - MeowDuels is told who is looking as
  # well as who is being looked at - which is what makes the duel bolt and the
  # party star show only to the people in that duel or party.
  "%rel_meowduels_tabprefix%": 500
  "%rel_meowduels_tabsuffix%": 500
