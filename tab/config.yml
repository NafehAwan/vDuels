# MeowDuels draws the sidebar scoreboard (see the plugin's scoreboard.yml).
# TAB only handles the tab list + nametags, so its scoreboard stays OFF.
#
# There is deliberately NO "conditions:" section any more. A single malformed
# entry there makes TAB drop the whole section, every %condition:...% then
# resolves to nothing, and prefixes disappear server-wide. MeowDuels decides the
# prefix itself in %meowduels_tabprefix%.
scoreboard:
  enabled: false
header-footer:
  enabled: true
  # ONE design, for everybody.
  #
  # Kept as a "designs:" block with a single entry rather than a bare
  # header:/footer: pair. Both are valid YAML and both are documented TAB
  # formats, but this config had already been written in the designs form, and
  # swapping it for the flat one took the whole tab list down to vanilla. Not
  # worth finding out why - the structure that was working stays.
  #
  # There used to be three designs - fight, party, default - each with a
  # display-condition. They are gone on purpose: a duel and a party are meant to
  # look like the rest of the server, and the one thing that marks them out is
  # WHO is in the list, not what is written above it.
  #
  # MeowDuels hides the players you are not fighting, partied with, or being
  # spectated by. Tab list ONLY - they are still in the world, visible and
  # hittable - and one-directional, so the rest of the server still sees you
  # with your real rank.
  designs:
    default:
      display-condition: '%world%!=disabledworld'
      header:
      - ''
      - <b><gradient:#CD052D:#D90707>ʙʟᴏᴏᴅᴛʜɪʀѕ</gradient><gradient:#D90707:#D90707>ᴛ</gradient></b>
      - ''
      footer:
      - ''
      - '&7Online: &#D90707%online% &8• &7In Duels: &#D90707%meowduels_players_in_duels%'
      - <gradient:#CD052D:#D90707>ʙʟᴏᴏᴅᴛʜɪʀѕᴛ.ꜰᴜ</gradient><gradient:#D90707:#D90707>ɴ</gradient>
      - ''
# Turns tab-list formatting ON. The actual prefix/suffix values are per-group
# properties and live in groups.yml - TAB ignores them if they are put here.
tablist-name-formatting:
  enabled: true
prevent-spectator-effect:
  enabled: false
debug: false
use-online-uuid-in-tablist: true
permission-refresh-interval: 1000
compensate-for-packetevents-bug: false
assign-groups-by-permissions: false
primary-group-finding-list:
- Owner
- Admin
- Helper
- default
belowname-objective:
  fancy-value-default: NPC
  fancy-value: '&c%health%'
  view-distance: 10
  enabled: false
placeholders:
  register-tab-expansion: false
  locale: en-US
# Only the two relational placeholders need pinning down. Everything the header
# and footer use is either static or already refreshed often enough by TAB's own
# default; the per-match placeholders that needed a tight interval went with the
# fight and party designs.
placeholder-refresh-intervals:
  '%rel_meowduels_tabprefix%': 500
  '%rel_meowduels_tabsuffix%': 500
global-playerlist:
  update-latency: false
  enabled: false
playerlist-objective:
  title: TAB
  value: ''
  render-type: INTEGER
  enabled: true
config-version: 7
components:
  minimessage-support: true
  disable-shadow-for-heads: true
proxy-support:
  channel-name-suffix: custom
  enabled: true
bossbar:
  enabled: false
layout:
  enabled: false
mysql:
  enabled: false
per-world-playerlist:
  enabled: false
ping-spoof:
  enabled: false
scoreboard-teams:
  enabled: true
  enable-collision: false
  invisible-nametags: false
  case-sensitive-sorting: true
  can-see-friendly-invisibles: false
  # Untouched. A party gets its own tab list (MeowDuels hides everyone else from
  # its members, the same way it does for a duel), so there is nothing for
  # sorting to group and no reason to reorder the global list for everyone.
  # %meowduels_party_sort% still exists if you ever want a party SECTION in the
  # global list instead of a separate list - put it first here and non-party
  # players all tie on it, falling through to the order below unchanged.
  sorting-types:
  - GROUPS:wraith,founder,owner,developer,co-owner,manager,sr-admin,admin,dev,goat,builder,good-boy,miwi,sr-mod,staff,mod,jr-mod,helper,media,famous,ht3,vip,popular1,popular,active,default
  - PLACEHOLDER_A_TO_Z:%player%
  # There is deliberately NO disable-condition here.
  #
  # It used to release nametags for anyone in a duel, so MeowDuels could draw
  # the ⚡ name itself. But TAB implements tab-list SORTING with these same
  # teams, so a fighter lost their sort team and the client floated them to the
  # top of the list - the sorting above stopped applying to exactly the players
  # who were fighting.
  #
  # TAB keeps the teams now and draws the duel nametag from
  # %rel_meowduels_tagprefix% (see groups.yml), which gives the same ⚡ without
  # anything else needing to own a team.
